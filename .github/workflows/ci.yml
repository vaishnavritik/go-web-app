
name: Go Web App CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.5"

      - name: Run tests
        run: go test ./...

      - name: Build application
        run: go build -o /tmp/go-web-app .

      - name: Build Docker image
        run: docker build -t vasrivastava/go-web-app:${{ github.sha }} -t vasrivastava/go-web-app:latest .

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push vasrivastava/go-web-app:${{ github.sha }}
          docker push vasrivastava/go-web-app:latest
